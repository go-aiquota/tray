name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: '0'
      - name: Test
        run: go test -count=1 -coverprofile=cover.out ./...
        env:
          CGO_ENABLED: '0'
      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1

  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
