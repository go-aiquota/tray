name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # pwsh (the Windows default shell) mis-tokenizes an unquoted
        # -flag=value.ext argument on this runner (observed:
        # "-coverprofile=cover.out" split into "-coverprofile=cover" and a
        # bare ".out", which go test then tried to import as a package) —
        # bash (Git for Windows, present on every GitHub-hosted Windows
        # runner) sidesteps it and matches the other two OSes' shell.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: '0'
      - name: Test
        run: go test -count=1 -coverprofile=cover.out ./...
        env:
          CGO_ENABLED: '0'
      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1

  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  # Every platform a release carries binaries for, built on every pull request
  # so a break shows before the tag. Windows, Linux and macOS are also TESTED
  # above, on a runner of their own; FreeBSD, OpenBSD and NetBSD are only
  # cross-built (GitHub has no runner for them): the build is the whole check.
  cross:
    name: cross-build (6 OSes x amd64, arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go run ./internal/reldist --check --out dist
