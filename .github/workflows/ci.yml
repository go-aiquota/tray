name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # pwsh (the Windows default shell) mis-tokenizes an unquoted
        # -flag=value.ext argument on this runner (observed:
        # "-coverprofile=cover.out" split into "-coverprofile=cover" and a
        # bare ".out", which go test then tried to import as a package) —
        # bash (Git for Windows, present on every GitHub-hosted Windows
        # runner) sidesteps it and matches the other two OSes' shell.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: '0'
      - name: Test
        run: go test -count=1 -coverprofile=cover.out ./...
        env:
          CGO_ENABLED: '0'
      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1

  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  # Every platform a release carries binaries for, built on every pull request
  # so a break shows before the tag. Windows, Linux and macOS are also TESTED
  # above, on a runner of their own; FreeBSD, OpenBSD and NetBSD are only
  # cross-built (GitHub has no runner for them): the build is the whole check.
  cross:
    name: cross-build (6 OSes x amd64, arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go run ./internal/reldist --check --out dist

  # The release archives, run: the same `reldist smoke` the release workflow
  # runs before it publishes, here on a throwaway version (v0.0.0) for the
  # archive of each runner's own platform, so a break shows in the pull request.
  smoke:
    name: smoke ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: tar.gz, runner: ubuntu-latest }
          - { goos: linux,   goarch: arm64, ext: tar.gz, runner: ubuntu-24.04-arm }
          - { goos: darwin,  goarch: arm64, ext: tar.gz, runner: macos-latest }
          - { goos: windows, goarch: amd64, ext: zip,    runner: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go run ./internal/reldist --version v0.0.0 --out dist --only ${{ matrix.goos }}/${{ matrix.goarch }}
      - run: mkdir smoke
      - run: go run ./internal/reldist smoke --archive dist/aiquota_v0.0.0_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.ext }} --sums dist/SHA256SUMS --version v0.0.0 --dest smoke

  # The shared-reading lock, repeated: on Windows a lock file its holder has
  # just removed is "delete pending" and creating it fails with access denied,
  # which one run of this test hit only some of the time. 200 runs on the
  # Windows runner make the race show; gotest fails when the selection ran nothing.
  lock-stress:
    name: lock stress (windows, -count=200)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go run github.com/go-fleettools/fleettools/cmd/gotest@latest -count=200 -run '^TestConcurrentCallersShareOneFetch$' ./cmd/aiquota
        env:
          CGO_ENABLED: '0'
